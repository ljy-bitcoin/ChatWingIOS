name: Build iPhone IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Check project structure
        run: python3 Scripts/verify.py

      - name: Build for real iPhone
        run: |
          xcodebuild \
            -project ChatWing.xcodeproj \
            -scheme ChatWing \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/ChatWing.app"
          test -d "$APP"
          test -d "$APP/PlugIns/ChatWingBroadcast.appex"
          test -d "$APP/PlugIns/ChatWingKeyboard.appex"
          mkdir -p package/Payload
          ditto "$APP" package/Payload/ChatWing.app
          cd package
          zip -qry ChatWing-unsigned.ipa Payload

      - name: Upload IPA for download
        uses: actions/upload-artifact@v4
        with:
          name: ChatWing-iPhone-IPA
          path: package/ChatWing-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
