name: iOS Build and Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Check project structure
        run: python3 Scripts/verify.py

      - name: Build app and extensions
        run: |
          xcodebuild \
            -project ChatWing.xcodeproj \
            -scheme ChatWing \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Run unit tests
        shell: bash
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for v in d["devices"].values() for x in v if x["name"].startswith("iPhone")))')
          xcodebuild \
            -project ChatWing.xcodeproj \
            -scheme ChatWing \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            CODE_SIGNING_ALLOWED=NO \
            test
